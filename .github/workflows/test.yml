name: test

# These suites previously had no caller at all: no CI existed, and the Makefile
# wired only a subset. A guard could regress with every local check still green.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  hooks:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # macOS ships bash 3.2, which is what hooks.json actually invokes as
      # `bash`. Running the guards here is deliberate: a bash-4-only construct
      # made the worktree escape check fail OPEN on stock macOS while passing
      # on a newer shell.
      # PIN the interpreter. `bash` on PATH may be a newer Homebrew build on a
      # future runner image, which would silently drop the 3.2 coverage this
      # job exists for. /bin/bash is the shell hooks.json actually gets.
      - run: /bin/bash --version
      - run: BASH_BIN=/bin/bash make test-hooks

  hooks-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make test-hooks

  workspace-manager:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci || npm install
        working-directory: worker/mcp-servers/workspace-manager
      - run: npm test
        working-directory: worker/mcp-servers/workspace-manager

  commander:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The live-acceptance test shells out to workspace-manager's CLI bundle,
      # which imports better-sqlite3 from gitignored node_modules. Without this
      # the commander job cannot run it.
      - run: npm install
        working-directory: worker/mcp-servers/workspace-manager
      - run: pip install -e '.[dev]' || pip install -e .
        working-directory: commander
      - run: python -m pytest tests/ -q
        working-directory: commander
